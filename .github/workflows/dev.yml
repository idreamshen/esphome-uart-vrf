name: Dev

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        config_name: [esp01s, esp32wroom32d, esp01s_nopass, esp01s_odd_nopass, esp01s_even_nopass]
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: Replace external_components with local path
      run: |
        for file in example/*.yaml; do
          sed -i '/external_components:/,/url:/c\
        external_components:\
          - source:\
              type: local\
              path: /github/workspace/components' "$file"
        done
    - name: Build
      id: esphome-build
      uses: esphome/build-action@v7.0.0
      with:
        yaml-file: "example/${{ matrix.config_name }}.yaml"
        version: 2026.7.4
        platform: linux/amd64
    - name: Rename bin files
      run: |
        cd ${{ steps.esphome-build.outputs.name }}
        for file in *.bin; do
          if [[ $file == *"factory"* ]]; then
            mv "$file" "${{ matrix.config_name }}.factory.bin"
          elif [[ $file == *"ota"* ]]; then
            mv "$file" "${{ matrix.config_name }}.ota.bin"
          fi
        done
        ls -lha
    - name: Upload bin
      uses: actions/upload-artifact@v4.4.3
      with:
        # Artifact name
        name: "${{ matrix.config_name }}-bin"
        # A file, directory or wildcard pattern that describes what to upload
        path: ${{ steps.esphome-build.outputs.name }}/*.bin
        # The desired behavior if no files are found using the provided path.
        retention-days: 3

  host-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/requirements-e2e.txt
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-host-${{ hashFiles('tests/requirements-e2e.txt', 'tests/e2e/host.yaml.j2') }}
          restore-keys: |
            ${{ runner.os }}-platformio-host-
      - name: Install host E2E dependencies
        run: python -m pip install -r tests/requirements-e2e.txt
      - name: Run simulator tests
        run: make test-fast TEST_PYTHON=python
      - name: Run host E2E tests
        run: |
          make test-e2e TEST_PYTHON=python \
            E2E_BASETEMP="${RUNNER_TEMP}/uart-vrf-e2e"
      - name: Upload host E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4.4.3
        with:
          name: host-e2e-diagnostics
          path: |
            host-e2e-results/junit.xml
            ${{ runner.temp }}/uart-vrf-e2e/**/compile.log
            ${{ runner.temp }}/uart-vrf-e2e/**/host.log
            ${{ runner.temp }}/uart-vrf-e2e/**/*.jsonl
            ${{ runner.temp }}/uart-vrf-e2e/**/preferences/**
          if-no-files-found: warn
          retention-days: 7

  notify:
    runs-on: ubuntu-24.04
    needs: [build, host-e2e]
    if: ${{ always() && github.event_name == 'pull_request' && needs.build.result == 'success' && needs.host-e2e.result == 'success' }}
    steps:
      - name: Notify artifact link
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          hide_and_recreate: true
          hide_classify: "OUTDATED"
          message: |
            You can download the binary from the [Artifacts section](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for debugging.

            - Commit Sha: ${{ github.event.pull_request.head.sha }}
            - Action run number: **${{ github.run_number }}**
